{% extends "base.html" %} 
{% block content %}

<h1 > Food experiments </h1>
    <h6> Are you tired during your holiday? Here are a few food related experiments you can try and they are also very educational! </h6>

<div id="demo" class="carousel slide mb-3" data-bs-ride="carousel">

  <!-- Indicators/dots -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
  </div>
  
  <!-- The slideshow/carousel -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="../static/img/foodc1.jpg" alt="f1" class="d-block" style="width:100%">
    </div>
    <div class="carousel-item">
      <img src="../static/img/fc2.jpg" alt="f2" class="d-block" style="width:100%">
    </div>
    <div class="carousel-item">
      <img src="../static/img/fc3.webp" alt="f3" class="d-block" style="width:100%">
    </div>
  </div>
  
  <!-- Left and right controls/icons -->
  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>


<!--

  <div>
    <h4 class="font-weight-bold"> Experiments </h4>

          src="../static/img/Rock-Candy-Sticks.jpg"
          alt="sugarcrystals"

          width="200px"
          class="d-block mx-auto mb-2"
        />
      </a>
        <p></p> Sugarcrystals </p>
      </div>
      <div class="col text-center">
        <a href="{{url_for('icecream')}}">
        <img
          src="../static/img/icecream.jpg"
          alt="icecream"
          height="200px"
          width="200px"
          class="d-block mx-auto mb-2"
        />
        </a>
        <p>DIY Icecream</p>

      </div>
      <div class="col text-center">
        <a href="{{url_for('instantslushie')}}">
        <img
          src="../static/img/slushie.jpg"
          alt="slushie"
          height="200px"
          width="200px"
          class="d-block mx-auto mb-2"
        />
        </a>
        <p> Instant slushie </p>
      </div>

      <div class="col text-center">
        <a href="{{url_for('poppingboba')}}">

          src="../static/img/boba.webp"

          class="d-block mx-auto mb-2"

        </a>
        <p>DIY boba</p>

      </div>
    </div>
  </div>


{% endblock %}
