<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <title>DIY chemistry at home</title>
    <link rel="icon" type="image/x-icon" href="../static/img/favicon.png" />

    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/index.css' )}}"
    />

    {% block head%}{%endblock%}
  </head>
  <body>
    
    <header>
      <!-- Favicon with title website -->
      <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">
              <img src="../static/img/favicon.png" width="30" height="30" class="d-inline-block align-top" alt="">
              DIY Chemistry at home
            </a>
              
            <button
              class="navbar-toggler"
              type="button"
              data-toggle="collapse"
              data-target="#navbarMenu"
              aria-controls="navbarMenu"
              aria-expanded="false"
              aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span> 
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
              <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                  <a class="nav-link" href="{{url_for('index')}}">Home</a>
                </li>
                <li class="nav-item">
                  <a  class="nav-link" href="{{url_for('experiments')}}"> Experiments</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{{url_for('contact_page') }}"> Contact </a>
                </li>
              </ul>
            </div>
        </div>
      </nav>
    </header>  
  
  <div class="container">
    <div class="content">
      {% block content %}{%endblock%}
    </div>
  </div>

    <footer class="footer"> <h6> &copy; Serena </h6> </footer>


    </div>
  </div>


    <!-- Loading bootstrap JS scripts -->
    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
